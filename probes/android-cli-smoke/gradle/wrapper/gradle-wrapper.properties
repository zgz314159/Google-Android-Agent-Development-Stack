distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# China-mainland-accessible first download (Tencent mirror). The distribution bytes are
# identical to the official one, so distributionSha256Sum still verifies them; Gradle
# rejects the download on any mismatch.
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-9.1.0-bin.zip
distributionSha256Sum=a17ddd85a26b6a7f5ddb71ff8b05fc5104c0202c6e64782429790c933686c806
# Official fallback (documented, not silently applied): if the mirror is unreachable, set
#   distributionUrl=https\://services.gradle.org/distributions/gradle-9.1.0-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
